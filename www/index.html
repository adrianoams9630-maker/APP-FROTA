<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#b20000">
<title>Oeste Cargas · Viagem</title>
<style>
:root{
  --red:#b20000; --red-2:#8c0000; --ink:#16223f; --bg:#f1f3f7; --card:#fff; --line:#dde2ea; --muted:#5f6b82;
  --ok:#1b7f45; --ok-bg:#e3f4ea; --warn:#a15c00; --warn-bg:#fdf0da; --bad:#c01526; --bad-bg:#fde6e8; --info:#1d5fbf; --info-bg:#e5eefc;
  --r:14px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:60px}
header img{height:34px;width:auto}
header .tit{flex:1;min-width:0;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;min-width:44px;height:44px;font-size:20px;display:grid;place-items:center}
.sync{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;font-weight:600;background:#fff;border-bottom:1px solid var(--line)}
.sync .dot{width:10px;height:10px;border-radius:50%;background:#aab2c3;flex-shrink:0}
.sync.on .dot{background:var(--ok)} .sync.off .dot{background:var(--bad)}
.sync .fill{flex:1}
.sync button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-weight:700}
main{padding:14px 14px calc(90px + var(--safe-b));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.muted{color:var(--muted)} .peq{font-size:14px}
.placa{display:inline-flex;flex-direction:column;border:2px solid #111;border-radius:5px;overflow:hidden;background:#fff;vertical-align:middle}
.placa i{height:6px;background:#1a47a8} .placa b{font-size:18px;letter-spacing:1.5px;padding:1px 8px 2px;font-family:'Roboto Mono',monospace;color:#111}
.linha{display:flex;align-items:center;gap:10px}
.fill{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px;padding:10px 16px}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.55}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.ink{background:var(--ink)} .btn.warn{background:#d98200}
.btn.peq{min-height:44px;font-size:15px;width:auto}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acao{background:#fff;border:2px solid var(--line);border-radius:var(--r);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:16px;padding:10px}
.acao .ic{font-size:30px;line-height:1}
.acao:active{background:#f6f7fa}
.acao.full{grid-column:span 2;flex-direction:row;min-height:64px;width:100%}
#btRetomar{margin-bottom:10px;border-width:3px;font-size:18px}
.status{border-radius:12px;padding:12px 14px;font-weight:700;font-size:18px;margin:10px 0}
.s-mov{background:var(--info-bg);color:var(--info)} .s-par{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:#f5f7fa;border-radius:10px;padding:8px}
.kpis small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpis b{font-size:19px}
label.rot{display:block;font-weight:700;margin:14px 0 6px}
label.rot em{color:var(--bad);font-style:normal}
input.f,select.f,textarea.f{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:18px}
input.f:focus,textarea.f:focus{border-color:var(--ink);outline:none}
textarea.f{min-height:90px}
.dica{font-size:13.5px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:24px;padding:10px 16px;font-weight:700;font-size:15px}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.ck span{flex:1;font-weight:600}
.ck .sn{display:flex;gap:6px}
.ck .sn button{min-width:62px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.ck .sn button.sim{border-color:var(--ok);background:var(--ok);color:#fff}
.ck .sn button.nao{border-color:var(--bad);background:var(--bad);color:#fff}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;font-weight:600}
.tog input{width:26px;height:26px;accent-color:var(--red)}
.foto{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;background:#fff}
.foto img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto 10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f4}
.tl li:last-child{border:0}
.tl .ic{width:34px;height:34px;border-radius:50%;background:var(--info-bg);display:grid;place-items:center;flex-shrink:0;font-size:16px}
.tl .pend{font-size:12px;color:var(--warn);font-weight:700}
.tl .err{font-size:12px;color:var(--bad);font-weight:700}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12.5px;font-weight:700}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.aviso{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.aviso.bad{background:var(--bad-bg);color:var(--bad)} .aviso.warn{background:var(--warn-bg);color:var(--warn)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:10px;z-index:15}
.rodape .btn{flex:1}
#login{min-height:100%;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + var(--safe-t)) 22px 30px}
#login img{width:78%;max-width:320px;margin-bottom:18px}
#login .card{width:100%;max-width:420px}
.erro{color:var(--bad);font-weight:600;min-height:22px;margin-top:10px}
.modal-f{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + var(--safe-b))}
.modal h3{margin:0 0 8px;font-size:19px}
.modal .bts{display:flex;gap:10px;margin-top:16px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(84px + var(--safe-b));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;max-width:520px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
.vazio{text-align:center;color:var(--muted);padding:24px 10px}
</style>
</head>

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, c=0) => (v===null||v===undefined||v==='') ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hora = iso => iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const duracao = min => { min = Math.max(0, Math.round(min||0)); const h = Math.floor(min/60), m = min%60; return h ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`; };
const numBR = s => { s = String(s||'').trim().replace(/[^\d,.-]/g,''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,''); const n = Number(s); return isFinite(n) ? n : null; };
const soDigitos = s => String(s||'').replace(/\D/g,'');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const placa = p => p ? `<span class="placa"><i></i><b>${esc(p)}</b></span>` : '';
const refViagem = v => v ? (v.id ? String(v.id) : v.uuid_app) : null;
function toast(msg, tipo=''){ $('#toast').innerHTML = ''; const t = document.createElement('div'); t.className = 'toast ' + tipo; t.textContent = msg; $('#toast').appendChild(t); setTimeout(()=>t.remove(), tipo==='bad'?5000:2600); }
function vibrar(){ try { if (CAP.Haptics) CAP.Haptics.impact({ style:'LIGHT' }); else if (navigator.vibrate) navigator.vibrate(30); } catch(e){} }

/* ---------------- armazenamento local (IndexedDB) ---------------- */
const DB = {
  db:null,
  abrir(){ return new Promise((ok, erro) => { const r = indexedDB.open('oc_viagem', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('fila', { keyPath:'uuid' }); d.createObjectStore('fotos'); };
    r.onsuccess = () => { this.db = r.result; ok(); }; r.onerror = () => erro(r.error); }); },
  tx(store, modo, fn){ return new Promise((ok, erro) => { const t = this.db.transaction(store, modo); const s = t.objectStore(store); let res; const r = fn(s); if (r) r.onsuccess = () => res = r.result; t.oncomplete = () => ok(res); t.onerror = () => erro(t.error); }); },
  get(k){ return this.tx('kv','readonly', s => s.get(k)); },
  set(k, v){ return this.tx('kv','readwrite', s => s.put(v, k)); },
  del(k){ return this.tx('kv','readwrite', s => s.delete(k)); },
  filaTodos(){ return this.tx('fila','readonly', s => s.getAll()); },
  filaPut(op){ return this.tx('fila','readwrite', s => s.put(op)); },
  filaDel(u){ return this.tx('fila','readwrite', s => s.delete(u)); },
  fotoGet(u){ return this.tx('fotos','readonly', s => s.get(u)); },
  fotoSet(u, v){ return this.tx('fotos','readwrite', s => s.put(v, u)); },
  fotoDel(u){ return this.tx('fotos','readwrite', s => s.delete(u)); }
};
async function carregarFila(){ S.fila = (await DB.filaTodos()).sort((a,b) => a.seq - b.seq); }

/* ---------------- GPS (nunca trava um lançamento) ---------------- */
function lerPosicao(timeout=8000){
  return new Promise(ok => {
    let feito = false; const fim = p => { if (!feito){ feito = true; if (p) S.pos = p; ok(p); } };
    setTimeout(() => fim(null), timeout + 500);
    try {
      if (CAP.Geolocation) CAP.Geolocation.getCurrentPosition({ enableHighAccuracy:true, timeout, maximumAge:120000 })
        .then(r => fim({ lat:r.coords.latitude, lng:r.coords.longitude, t:Date.now() })).catch(() => fim(null));
      else if (navigator.geolocation) navigator.geolocation.getCurrentPosition(r => fim({ lat:r.coords.latitude, lng:r.coords.longitude, t:Date.now() }), () => fim(null), { enableHighAccuracy:true, timeout, maximumAge:120000 });
      else fim(null);
    } catch(e){ fim(null); }
  });
}
async function posicaoAgora(){ if (S.pos && Date.now() - S.pos.t < 120000) return S.pos; return await lerPosicao(4000); }

/* ---------------- câmera ---------------- */
async function tirarFoto(){
  if (CAP.Camera){
    const r = await CAP.Camera.getPhoto({ resultType:'base64', quality:60, width:1600, correctOrientation:true, source:'PROMPT',
      saveToGallery:false, promptLabelHeader:'Comprovante', promptLabelPhoto:'Escolher da galeria', promptLabelPicture:'Tirar foto', promptLabelCancel:'Cancelar' });
    return { base64: r.base64String, mime: 'image/' + (r.format === 'png' ? 'png' : 'jpeg') };
  }
  return new Promise((ok, erro) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return erro(new Error('Nenhuma foto')); const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => { const k = Math.min(1, 1600/Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); ok({ base64: cv.toDataURL('image/jpeg', 0.65).split(',')[1], mime:'image/jpeg' }); };
      img.onerror = () => erro(new Error('Não consegui abrir a foto')); img.src = url; };
    inp.click();
  });
}

/* ---------------- fila de lançamentos ---------------- */
async function lancar(tipo, dados, foto){
  const pos = await posicaoAgora();
  const op = { uuid: uuid(), tipo, quando: new Date().toISOString(), seq: Date.now() + Math.random(), status:'pendente', erro:null,
               motorista_id: S.sessao && S.sessao.motorista_id,
               dados: Object.assign({}, dados, pos ? { lat: +pos.lat.toFixed(6), lng: +pos.lng.toFixed(6) } : {}) };
  await DB.filaPut(op);
  if (foto){
    const fop = { uuid: uuid(), tipo:'comprovante_foto', quando: op.quando, seq: op.seq + 0.001, status:'pendente', erro:null,
                  motorista_id: op.motorista_id, dados:{ abastecimento_uuid: op.uuid, mime: foto.mime }, tem_foto:true };
    await DB.fotoSet(fop.uuid, foto.base64); await DB.filaPut(fop);
  }
  await carregarFila(); vibrar();
  sincronizar();
  return op;
}

/* ---------------- servidor ---------------- */
async function chamar(acao, dados, timeoutMs=25000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(S.cfg.servidor.replace(/\/+$/,'') + CAMINHO_API, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ acao, token: S.sessao && S.sessao.token, dados }), signal: ctl.signal });
    const txt = await r.text(); let j; try { j = JSON.parse(txt); } catch(e){ throw Object.assign(new Error('Servidor respondeu HTTP ' + r.status), { rede:true }); }
    return j;
  } catch(e){ if (e.rede === undefined) e.rede = true; throw e; }
  finally { clearTimeout(t); }
}
async function sincronizar(manual){
  if (S.sincronizando || !S.sessao) return;
  S.sincronizando = true; desenharSync();
  try {
    let pend = S.fila.filter(o => o.status === 'pendente');
    let ultimaResp = null;
    while (pend.length){
      const lote = []; let pesado = false;
      for (const o of pend){ if (o.tem_foto){ if (!lote.length){ lote.push(o); pesado = true; } break; } lote.push(o); if (lote.length >= 25) break; }
      const ops = [];
      for (const o of lote){ const x = { uuid:o.uuid, tipo:o.tipo, quando:o.quando, dados:Object.assign({}, o.dados) };
        if (o.tem_foto) x.dados.base64 = await DB.fotoGet(o.uuid); ops.push(x); }
      const j = await chamar('sync', { ops }, pesado ? 90000 : 30000);
      if (j.auth === false){ await sessaoExpirada(); return; }
      if (!j.sucesso) throw Object.assign(new Error(j.erro || 'Falha ao sincronizar'), { rede:false });
      for (const res of j.resultados){
        const o = lote.find(x => x.uuid === res.uuid); if (!o) continue;
        if (res.ok){ await DB.filaDel(o.uuid); if (o.tem_foto) await DB.fotoDel(o.uuid);
          if (o.tipo === 'abastecimento' && res.anomalia) toast('Abastecimento enviado, mas marcado para conferência: ' + (res.anomalia_motivo||''), 'bad'); }
        else { o.status = 'erro'; o.erro = res.erro; await DB.filaPut(o); }
      }
      ultimaResp = j; await carregarFila(); pend = S.fila.filter(o => o.status === 'pendente');
    }
    if (!ultimaResp){ const j = await chamar('estado', {}); if (j.auth === false){ await sessaoExpirada(); return; } if (j.sucesso) ultimaResp = j; }
    if (ultimaResp && ultimaResp.estado){ S.estado = ultimaResp.estado; await DB.set('estado', S.estado); }
    S.ultimoSync = new Date().toISOString(); await DB.set('ultimoSync', S.ultimoSync);
    S.online = true;
    if (manual) toast(S.fila.some(o=>o.status==='erro') ? 'Sincronizado, com lançamentos recusados' : 'Tudo sincronizado', S.fila.some(o=>o.status==='erro') ? 'bad' : 'ok');
  } catch(e){
    if (e.rede){ S.online = false; if (manual) toast('Sem conexão. Os dados ficam salvos no celular e sobem sozinhos.', 'bad'); }
    else if (manual) toast(e.message, 'bad');
  } finally { S.sincronizando = false; desenhar(); }
}
async function sessaoExpirada(){ S.sessao = Object.assign({}, S.sessao, { token:null }); await DB.set('sessao', S.sessao); S.sincronizando = false; telaLogin('Sua sessão expirou. Entre de novo — nada do que você lançou foi perdido.'); }

/* ---------------- visão local = servidor + o que ainda não subiu ---------------- */
function visao(){
  const e = JSON.parse(JSON.stringify(S.estado || {}));
  e.viagens_planejadas = e.viagens_planejadas || [];
  let ativa = e.viagem_ativa || null; if (ativa){ ativa.eventos = ativa.eventos || []; ativa.entregas = ativa.entregas || []; }
  let km = (e.veiculo && e.veiculo.km_atual) || 0;
  const ev = (op, tipo, titulo, detalhe, extra) => ({ quando:op.quando, tipo, titulo, detalhe, km: op.dados.km ? numBR(op.dados.km) : null, extra: extra||null, pendente:true });
  for (const op of S.fila){
    if (op.status === 'erro' || op.tipo === 'comprovante_foto') continue;
    const d = op.dados;
    if (op.tipo === 'viagem_criar') e.viagens_planejadas.push({ id:null, uuid_app:op.uuid, origem:d.origem, destino:d.destino, placa: e.veiculo && e.veiculo.placa, entregas:[], local:true });
    else if (op.tipo === 'viagem_iniciar'){
      const p = e.viagens_planejadas.find(v => refViagem(v) === d.viagem_ref) || {};
      e.viagens_planejadas = e.viagens_planejadas.filter(v => refViagem(v) !== d.viagem_ref);
      ativa = { id:p.id||null, uuid_app:p.uuid_app||(p.id?null:d.viagem_ref), origem:p.origem, destino:p.destino, placa:p.placa||(e.veiculo&&e.veiculo.placa),
                carreta_placa:p.carreta_placa, status:'em_andamento', saida:op.quando, km_saida:numBR(d.km), entregas:(p.entregas||[]).slice(), eventos:[], parada_aberta:null };
      const nao = Object.entries(d.checklist||{}).filter(([k,v]) => v === false).length;
      ativa.eventos.push(ev(op,'checklist', nao ? 'Checklist com pendência' : 'Checklist aprovado'));
      ativa.eventos.push(ev(op,'saida','Saída', (p.origem||'') + ' → ' + (p.destino||'')));
    }
    else if (!ativa) { /* lançamento sem viagem ativa (ex.: abastecimento avulso) */ }
    else if (op.tipo === 'parada_inicio'){ ativa.parada_aberta = { uuid:op.uuid, tipo:d.tipo, inicio:op.quando, km:numBR(d.km), local:d.local };
      ativa.eventos.push(ev(op,'parada','Parada: ' + (TIPOS_PARADA[d.tipo]||'parada').toLowerCase(), d.local)); }
    else if (op.tipo === 'parada_fim'){ if (ativa.parada_aberta && ativa.parada_aberta.uuid === d.parada_uuid) ativa.parada_aberta = null;
      ativa.eventos.push(ev(op,'retomada','Retomou a viagem')); }
    else if (op.tipo === 'abastecimento') ativa.eventos.push(ev(op,'abastecimento','Abastecimento', `${nf(numBR(d.litros),1)} L · ${brl(numBR(d.valor))}${d.comprovante_numero?' · Nº '+d.comprovante_numero:''}`));
    else if (op.tipo === 'ocorrencia') ativa.eventos.push(ev(op,'ocorrencia','Ocorrência: ' + (TIPOS_OCORR[d.tipo]||d.tipo).toLowerCase(), d.descricao));
    else if (op.tipo === 'entrega'){ const en = ativa.entregas.find(x => x.id === d.entrega_id); if (en) en.status = d.status;
      ativa.eventos.push(ev(op,'entrega', STATUS_ENTREGA[d.status] || 'Entrega', en ? en.cliente : '')); }
    else if (op.tipo === 'viagem_finalizar'){ e.ultima = { destino: ativa.destino, chegada: op.quando }; ativa = null; }
    if (d.km && numBR(d.km)) km = Math.max(km, numBR(d.km));
  }
  e.viagem_ativa = ativa; e.km_ref = km;
  return e;
}

/* ---------------- domínio ---------------- */
const TIPOS_PARADA = { almoco:'Almoço', descanso:'Descanso', pernoite:'Pernoite', carga_descarga:'Carga/descarga', fiscalizacao:'Fiscalização', manutencao:'Manutenção', outro:'Outra' };
const ICONE_PARADA = { almoco:'🍽️', descanso:'😴', pernoite:'🛏️', carga_descarga:'📦', fiscalizacao:'👮', manutencao:'🔧', outro:'⏸️' };
const TIPOS_OCORR = { avaria:'Avaria', acidente:'Acidente', pane:'Pane mecânica', atraso:'Atraso', roubo:'Roubo/furto', carga:'Problema com a carga', outro:'Outro' };
const STATUS_ENTREGA = { entregue:'Entregue', devolucao_parcial:'Devolução parcial', devolucao_total:'Devolução total', recusada:'Recusada', pendente:'Pendente', em_rota:'Em rota' };
const CHECK_ITENS = [['pneus_ok','Pneus'],['freios_ok','Freios'],['luzes_ok','Luzes e setas'],['oleo_agua_ok','Óleo e água'],['documentos_ok','Documentos do veículo'],['epi_ok','EPI'],['limpeza_ok','Limpeza / cabine']];
const ICONE_EVENTO = { saida:'▶️', chegada:'🏁', checklist:'✅', abastecimento:'⛽', parada:'⏸️', retomada:'▶️', ocorrencia:'⚠️', entrega:'📦' };

/* ---------------- telas ---------------- */
function cabecalho(titulo, voltar){
  return `<header>${voltar ? '<button id="btVoltar" aria-label="Voltar">←</button>' : `<img src="${LOGO}" alt="Oeste Cargas">`}
    <div class="tit">${esc(titulo||'')}</div><button id="btMenu" aria-label="Pendências">☰</button></header><div id="sync" class="sync"></div>`;
}
function desenharSync(){
  const el = $('#sync'); if (!el) return;
  const pend = S.fila.filter(o=>o.status==='pendente').length, err = S.fila.filter(o=>o.status==='erro').length;
  el.className = 'sync ' + (S.online ? 'on' : 'off');
  el.innerHTML = `<span class="dot"></span><span>${S.sincronizando ? 'Enviando…' : (S.online ? 'Online' : 'Sem sinal')}</span>
    <span class="muted">${pend ? pend + ' para enviar' : 'tudo enviado'}${err ? ` · <b style="color:var(--bad)">${err} recusado(s)</b>` : ''}</span>
    <span class="fill"></span><button id="btSync">${S.sincronizando ? '…' : 'Sincronizar'}</button>`;
  $('#btSync').onclick = () => sincronizar(true);
}
function montar(html, titulo, voltar){
  $('#raiz').innerHTML = cabecalho(titulo, voltar) + html;
  desenharSync();
  const bv = $('#btVoltar'); if (bv) bv.onclick = voltarTela;
  $('#btMenu').onclick = () => irPara('pendencias');
  window.scrollTo(0, 0);
}
function irPara(tela, dados){ S.pilha.push(S.tela); S.tela = tela; S.form = dados || {}; desenhar(); }
function voltarTela(){ S.tela = S.pilha.pop() || 'inicio'; S.form = {}; desenhar(); }
function desenhar(){
  if (!S.sessao || !S.sessao.token) return telaLogin();
  const v = visao();
  if (S.tela === 'inicio') return v.viagem_ativa ? telaViagem(v) : telaInicio(v);
  const f = { checklist:telaChecklist, avulsa:telaAvulsa, abastecimento:telaAbastecimento, parada:telaParada, retomar:telaRetomar,
              ocorrencia:telaOcorrencia, entregas:telaEntregas, finalizar:telaFinalizar, pendencias:telaPendencias }[S.tela];
  if (f) return f(v);
  S.tela = 'inicio'; desenhar();
}

function avisosTopo(){
  const err = S.fila.filter(o=>o.status==='erro').length;
  return err ? `<div class="aviso bad" id="avErr">⚠️ ${err} lançamento(s) recusado(s) pelo sistema. Toque para ver.</div>` : '';
}
function ligarAvisos(){ const a = $('#avErr'); if (a) a.onclick = () => irPara('pendencias'); }

function telaLogin(msg){
  $('#raiz').innerHTML = `<div id="login"><img src="${LOGO}" alt="Oeste Cargas">
    <div class="card"><h2 style="margin-top:0">Entrar no app de viagem</h2>
      <label class="rot" for="lgUser">CPF ou WhatsApp</label><input class="f" id="lgUser" inputmode="numeric" autocomplete="username" value="${esc((S.sessao&&S.sessao.login)||'')}">
      <label class="rot" for="lgPass">Senha</label><input class="f" id="lgPass" type="password" autocomplete="current-password">
      <div class="erro" id="lgErro">${esc(msg||'')}</div>
      <button class="btn" id="lgBt" style="margin-top:6px">Entrar</button>
      <p class="dica" style="text-align:center">A senha é liberada pelo escritório da Oeste Cargas.</p>
      <button class="btn sec peq" id="lgSrv" style="margin:8px auto 0">Servidor</button>
    </div><p class="dica" style="color:#ffd9d9">v${APP_VERSAO} · Paidegua Sistema</p></div>`;
  $('#lgBt').onclick = async () => {
    const b = $('#lgBt'), login = $('#lgUser').value.trim(), senha = $('#lgPass').value;
    if (!login || !senha) return ($('#lgErro').textContent = 'Informe CPF/WhatsApp e senha.');
    b.disabled = true; b.textContent = 'Entrando…';
    try {
      const info = CAP.Device ? await CAP.Device.getInfo().catch(()=>null) : null;
      const j = await chamar('login', { login, senha, versao: APP_VERSAO, dispositivo: info ? `${info.manufacturer} ${info.model} · Android ${info.osVersion}` : navigator.userAgent.slice(0,120) });
      if (!j.sucesso){ $('#lgErro').textContent = j.erro || 'Não foi possível entrar.'; return; }
      const outro = S.fila.length && S.fila.some(o => o.motorista_id && o.motorista_id !== j.motorista_id);
      if (outro && !(await confirmar('Há lançamentos de outro motorista neste celular que ainda não foram enviados. Descartar e continuar?', 'Descartar'))) return;
      if (outro){ for (const o of S.fila){ await DB.filaDel(o.uuid); if (o.tem_foto) await DB.fotoDel(o.uuid); } await carregarFila(); }
      S.sessao = { token:j.token, nome:j.nome, motorista_id:j.motorista_id, login }; S.estado = j.estado; S.online = true;
      await DB.set('sessao', S.sessao); await DB.set('estado', S.estado);
      S.tela = 'inicio'; S.pilha = []; desenhar(); sincronizar();
    } catch(e){ $('#lgErro').textContent = e.rede ? 'Sem conexão. O primeiro acesso precisa de internet.' : e.message; }
    finally { const bb = $('#lgBt'); if (bb){ bb.disabled = false; bb.textContent = 'Entrar'; } }
  };
  $('#lgPass').onkeydown = e => { if (e.key === 'Enter') $('#lgBt').click(); };
  $('#lgSrv').onclick = async () => { const v = await perguntar('Endereço do servidor', S.cfg.servidor); if (v){ S.cfg.servidor = v.trim(); await DB.set('cfg', S.cfg); toast('Servidor salvo', 'ok'); } };
}

    ${ve ? placa(ve.placa) : ''}</div>${ve ? `<div class="muted peq" style="margin-top:6px">${esc([ve.marca, ve.modelo].filter(Boolean).join(' '))} · último KM ${nf(v.km_ref)}</div>`

}

    <div class="card"><h2>Viagens para você</h2>
      ${pl.length ? pl.map((p,i) => `<div style="padding:10px 0;border-top:${i?'1px solid var(--line)':'0'}">

          ${p.observacao?`<div class="peq">${esc(p.observacao)}</div>`:''}</div>${placa(p.placa)}</div>
          <button class="btn" data-ini="${esc(refViagem(p))}" style="margin-top:10px">▶ Iniciar esta viagem</button></div>`).join('')
        : '<div class="vazio">Nenhuma viagem programada no momento.<br>Se o escritório já cadastrou, toque em Sincronizar quando tiver sinal.</div>'}

  ligarAvisos();

  $('#btAvulsa').onclick = () => { if (!v.veiculo) return toast('Você não tem veículo vinculado.', 'bad'); irPara('avulsa'); };
}
function telaAvulsa(v){
  montar(`<main><div class="card"><h2>Viagem não programada</h2><p class="muted peq">Use só quando o escritório não cadastrou a viagem. Ela será avisada ao escritório.</p>
    <label class="rot" for="avO">Origem <em>*</em></label><input class="f" id="avO" placeholder="Cidade de saída">
    <label class="rot" for="avD">Destino <em>*</em></label><input class="f" id="avD" placeholder="Cidade de destino">
    <label class="rot" for="avObs">Observação</label><textarea class="f" id="avObs"></textarea></div></main>
    <div class="rodape"><button class="btn" id="btOk">Continuar para o checklist</button></div>`, 'Nova viagem', true);
  $('#btOk').onclick = async () => {
    const origem = $('#avO').value.trim(), destino = $('#avD').value.trim();
    if (!origem || !destino) return toast('Informe origem e destino.', 'bad');
    const op = await lancar('viagem_criar', { origem, destino, observacao: $('#avObs').value.trim() });
    S.tela = 'checklist'; S.form = { ref: op.uuid }; desenhar();
  };
}
function telaChecklist(v){
  const p = v.viagens_planejadas.find(x => refViagem(x) === S.form.ref);
  if (!p){ S.tela = 'inicio'; return desenhar(); }
  const ck = S.form.ck || (S.form.ck = {});
  montar(`<main><div class="card"><div class="muted peq">Viagem</div><b style="font-size:18px">${esc(p.origem)} → ${esc(p.destino)}</b></div>
    <div class="card"><h2>Checklist de saída</h2><p class="muted peq" style="margin-top:0">Confira cada item antes de sair.</p>
      ${CHECK_ITENS.map(([k,l]) => `<div class="ck"><span>${l}</span><div class="sn"><button data-k="${k}" data-v="1" class="${ck[k]===true?'sim':''}">OK</button><button data-k="${k}" data-v="0" class="${ck[k]===false?'nao':''}">Problema</button></div></div>`).join('')}
      <label class="rot" for="ckObs">Observação</label><textarea class="f" id="ckObs" placeholder="Descreva o problema encontrado">${esc(S.form.obs||'')}</textarea></div>
    <div class="card"><label class="rot" for="ckKm" style="margin-top:0">KM do painel na saída <em>*</em></label>
      <input class="f" id="ckKm" inputmode="numeric" value="${esc(S.form.km || (v.km_ref ? String(v.km_ref) : ''))}"><div class="dica">Último KM registrado: ${nf(v.km_ref)}</div></div></main>
    <div class="rodape"><button class="btn ok" id="btOk">▶ Iniciar viagem</button></div>`, 'Checklist e saída', true);
  document.querySelectorAll('.sn button').forEach(b => b.onclick = () => { ck[b.dataset.k] = b.dataset.v === '1'; S.form.obs = $('#ckObs').value; S.form.km = $('#ckKm').value; telaChecklist(v); });
  $('#btOk').onclick = async () => {
    const falta = CHECK_ITENS.filter(([k]) => ck[k] === undefined);
    if (falta.length) return toast('Responda: ' + falta.map(x=>x[1]).join(', '), 'bad');
    const km = numBR($('#ckKm').value); if (!km) return toast('Informe o KM de saída.', 'bad');
    if (!(await conferirKm(km, v.km_ref))) return;
    const obs = $('#ckObs').value.trim();
    const problemas = CHECK_ITENS.filter(([k]) => ck[k] === false).map(x=>x[1]);
    if (problemas.length && !obs) return toast('Descreva o problema na observação.', 'bad');
    if (problemas.length && !(await confirmar(`Checklist com problema em: ${problemas.join(', ')}. O escritório será avisado. Iniciar mesmo assim?`, 'Iniciar'))) return;
    await lancar('viagem_iniciar', { viagem_ref: S.form.ref, km, checklist: Object.assign({}, ck, { observacao: obs }) });
    toast('Viagem iniciada. Boa viagem!', 'ok'); S.tela = 'inicio'; S.pilha = []; desenhar();
  };
}
function telaViagem(v){
  const a = v.viagem_ativa, par = a.parada_aberta;
  const min = a.saida ? (Date.now() - new Date(a.saida)) / 60000 : 0;
  const pend = a.entregas.filter(e => ['pendente','em_rota'].includes(e.status)).length;
  const eventos = a.eventos.slice().reverse();
  montar(`<main>${avisosTopo()}
    <div class="card"><div class="linha"><div class="fill"><div class="muted peq">Em viagem ${a.id?'#'+a.id:''}</div><b style="font-size:19px">${esc(a.origem||'')} → ${esc(a.destino||'')}</b></div>${placa(a.placa)}</div>
      <div class="status ${par?'s-par':'s-mov'}">${par ? `${ICONE_PARADA[par.tipo]||'⏸️'} Parado · ${esc(TIPOS_PARADA[par.tipo]||'parada')} há ${duracao((Date.now()-new Date(par.inicio))/60000)}` : '🚛 Em movimento'}</div>
      <div class="kpis"><div><small>Saída</small><b style="font-size:15px">${hora(a.saida)}</b></div><div><small>Tempo</small><b>${duracao(min)}</b></div><div><small>KM rodado</small><b>${a.km_saida ? nf(Math.max(0, v.km_ref - a.km_saida)) : '—'}</b></div></div></div>
    ${par ? `<button class="acao full" id="btRetomar" style="border-color:var(--ok);color:var(--ok)"><span class="ic">▶️</span> Retomar viagem</button>` : ''}
    <div class="acoes">
      <button class="acao" id="btAbast"><span class="ic">⛽</span>Abastecimento</button>
      ${par ? '' : '<button class="acao" id="btParada"><span class="ic">⏸️</span>Parada</button>'}
      <button class="acao" id="btOcorr"><span class="ic">⚠️</span>Ocorrência</button>
      ${a.entregas.length ? `<button class="acao" id="btEntr"><span class="ic">📦</span>Entregas ${pend ? `<span class="tag t-warn">${pend}</span>` : '<span class="tag t-ok">ok</span>'}</button>` : ''}
      <button class="acao ${par || !a.entregas.length ? '' : 'full'}" id="btFim" style="${par ? 'grid-column:span 2' : ''}"><span class="ic">🏁</span>Finalizar viagem</button>
    </div>
    <div class="card"><h2>Registros da viagem</h2>
      ${eventos.length ? `<ul class="tl">${eventos.map(e => `<li><div class="ic">${ICONE_EVENTO[e.tipo]||'•'}</div><div class="fill">
          <div class="linha"><b class="fill">${esc(e.titulo)}</b><span class="muted peq">${hora(e.quando)}</span></div>
          ${e.detalhe?`<div class="peq">${esc(e.detalhe)}</div>`:''}
          <div class="muted peq">${e.km?'KM '+nf(e.km):''}${e.tipo==='parada' && e.extra && !e.extra.aberta ? ' · ' + duracao(e.extra.minutos) : ''}</div>
          ${e.pendente?'<div class="pend">● aguardando sinal para enviar</div>':''}</div></li>`).join('')}</ul>` : '<div class="vazio">Nada registrado ainda.</div>'}
    </div>
    <p class="dica" style="text-align:center">Almoço e outras despesas são lançados no portal pelo escritório.</p></main>`, 'Em viagem');
  ligarAvisos();
  const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  on('#btRetomar', () => irPara('retomar'));
  on('#btAbast', () => irPara('abastecimento'));
  on('#btParada', () => irPara('parada'));
  on('#btOcorr', () => irPara('ocorrencia'));
  on('#btEntr', () => irPara('entregas'));
  on('#btFim', () => irPara('finalizar'));
}
async function conferirKm(km, ref){
  if (ref && km < ref) return confirmar(`O KM ${nf(km)} é MENOR que o último registrado (${nf(ref)}). Confira o painel do veículo. Salvar mesmo assim?`, 'Salvar assim');
  if (ref && km - ref > 2500) return confirmar(`O KM ${nf(km)} está ${nf(km-ref)} km acima do último registro (${nf(ref)}). Está correto?`, 'Está correto');
  return true;
}

    <label class="tog"><input type="checkbox" id="abBolso" ${f.bolso?'checked':''}> Paguei do meu bolso (entra no acerto)</label></div>
    <div class="card"><h2>Foto do comprovante <em style="color:var(--bad);font-style:normal">*</em></h2>
      <div class="foto">${f.foto ? `<img src="data:${f.foto.mime};base64,${f.foto.base64}" alt="Comprovante">` : '<div class="muted" style="margin-bottom:10px">Fotografe a nota com os valores legíveis.</div>'}

    <div class="rodape"><button class="btn" id="btOk">Salvar abastecimento</button></div>`, 'Abastecimento', true);
  const guarda = () => { f.km = $('#abKm').value; f.litros = $('#abL').value; f.valor = $('#abV').value; f.numero = $('#abN').value; f.posto = $('#abP').value; f.cidade = $('#abC').value; f.cheio = $('#abCheio').checked; f.bolso = $('#abBolso').checked; };
  const preco = () => { guarda(); const l = numBR(f.litros), vv = numBR(f.valor); $('#abPreco').innerHTML = l && vv ? 'Preço por litro: ' + brl(vv/l) + (ve.capacidade_tanque_l && l > ve.capacidade_tanque_l ? ` · <b style="color:var(--bad)">acima do tanque (${nf(ve.capacidade_tanque_l)} L)</b>` : '') : ''; };
  $('#abL').oninput = preco; $('#abV').oninput = preco;
  $('#abFoto').onclick = async () => { guarda(); try { f.foto = await tirarFoto(); telaAbastecimento(v); } catch(e){ if (!/cancel/i.test(e.message||'')) toast('Não foi possível usar a câmera: ' + e.message, 'bad'); } };
  $('#btOk').onclick = async () => {
    guarda();
    const km = numBR(f.km), litros = numBR(f.litros), valor = numBR(f.valor);
    if (!km || !litros || !valor) return toast('Preencha KM, litros e valor.', 'bad');
    if (!f.numero.trim()) return toast('Informe o nº da nota ou comprovante.', 'bad');
    if (valor / litros < 2 || valor / litros > 15) { if (!(await confirmar(`Preço por litro ficou ${brl(valor/litros)}. Confira litros e valor. Salvar mesmo assim?`, 'Salvar assim'))) return; }
    if (!(await conferirKm(km, v.km_ref))) return;

    const a = v.viagem_ativa;
    await lancar('abastecimento', { viagem_ref: a ? refViagem(a) : null, km, litros, valor, comprovante_numero: f.numero.trim(), posto: f.posto.trim(), cidade: f.cidade.trim(), tanque_cheio: f.cheio, pago_por_motorista: f.bolso }, f.foto);

  };
}

      </div></li>`).join('')}</ul>` : '<div class="vazio">✓ Tudo foi enviado.</div>'}</div>

  document.querySelectorAll('[data-re]').forEach(b => b.onclick = async () => { const o = S.fila.find(x => x.uuid === b.dataset.re); o.status = 'pendente'; o.erro = null; await DB.filaPut(o); await carregarFila(); telaPendencias(); sincronizar(true); });
  document.querySelectorAll('[data-des]').forEach(b => b.onclick = async () => { if (!(await confirmar('Descartar este lançamento? Ele não será enviado ao escritório.', 'Descartar'))) return;
    await DB.filaDel(b.dataset.des); await DB.fotoDel(b.dataset.des); await carregarFila(); telaPendencias(); });
  $('#btSair').onclick = async () => {

    if (!(await confirmar('Sair do app neste celular?', 'Sair'))) return;
    try { await chamar('logout', {}, 8000); } catch(e){}
    S.sessao = { login: S.sessao.login }; S.estado = null; await DB.set('sessao', S.sessao); await DB.del('estado'); telaLogin();
  };

/* ---------------- diálogos (sem alert/confirm nativos) ---------------- */
function confirmar(msg, ok='Confirmar'){
  return new Promise(res => { const d = document.createElement('div'); d.className = 'modal-f';
    d.innerHTML = `<div class="modal"><h3>Confirme</h3><p style="font-size:17px">${esc(msg)}</p><div class="bts"><button class="btn sec" data-n>Voltar</button><button class="btn" data-s>${esc(ok)}</button></div></div>`;
    document.body.appendChild(d); d.querySelector('[data-n]').onclick = () => { d.remove(); res(false); }; d.querySelector('[data-s]').onclick = () => { d.remove(); res(true); }; });
}
function perguntar(titulo, valor){
  return new Promise(res => { const d = document.createElement('div'); d.className = 'modal-f';
    d.innerHTML = `<div class="modal"><h3>${esc(titulo)}</h3><input class="f" id="pgV" value="${esc(valor||'')}"><div class="bts"><button class="btn sec" data-n>Cancelar</button><button class="btn" data-s>OK</button></div></div>`;
    document.body.appendChild(d); const i = d.querySelector('#pgV'); i.focus();
    d.querySelector('[data-n]').onclick = () => { d.remove(); res(null); }; d.querySelector('[data-s]').onclick = () => { d.remove(); res(i.value); }; });
}

/* ---------------- início ---------------- */
(async () => {
  try { await DB.abrir(); } catch(e){ document.body.innerHTML = '<p style="padding:20px">Não foi possível abrir o armazenamento do celular: ' + esc(e.message) + '</p>'; return; }
  S.cfg = Object.assign(S.cfg, await DB.get('cfg') || {});
  S.sessao = await DB.get('sessao') || null; S.estado = await DB.get('estado') || null; S.ultimoSync = await DB.get('ultimoSync') || null;
  await carregarFila();
  desenhar();
  if (S.sessao && S.sessao.token) sincronizar();
  lerPosicao(10000);
  window.addEventListener('online', () => { S.online = true; sincronizar(); });
  window.addEventListener('offline', () => { S.online = false; desenharSync(); });
  if (CAP.Network){ CAP.Network.addListener('networkStatusChange', st => { S.online = st.connected; if (st.connected) sincronizar(); else desenharSync(); }); }
  if (CAP.App){
    CAP.App.addListener('backButton', () => { if (document.querySelector('.modal-f')) return document.querySelector('.modal-f [data-n]').click(); if (S.tela !== 'inicio') voltarTela(); else CAP.App.minimizeApp(); });
    CAP.App.addListener('resume', () => { if (S.fila.some(o=>o.status==='pendente')) sincronizar(); if (S.tela === 'inicio') desenhar(); });
  }
  setInterval(() => { if (S.fila.some(o => o.status === 'pendente') || !S.ultimoSync || Date.now() - new Date(S.ultimoSync) > 300000) sincronizar(); }, 60000);
  setInterval(() => { if (S.tela === 'inicio' && !document.querySelector('.modal-f')) desenhar(); }, 60000);   // relógio da parada
})();
</script>
